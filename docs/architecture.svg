<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 740" width="2200" height="740"
     font-family="Helvetica, Arial, sans-serif">
  <title>FinSight architecture: prompt, collect posts, then the claim check</title>
  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4650"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a74b0"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="a-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4571b"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font-size: 21px; font-weight: 700; fill: #1f2933; }
      .h { font-size: 14.5px; font-weight: 700; fill: #1f2933; text-anchor: middle; }
      .s { font-size: 12px; fill: #52606d; text-anchor: middle; }
      .lbl { font-size: 12.5px; font-weight: 700; fill: #3c4650; }
      .lbl-r { font-size: 12.5px; font-weight: 700; fill: #3c4650; text-anchor: end; }
      .lbl-m { font-size: 12.5px; font-weight: 700; fill: #3c4650; text-anchor: middle; }
      .lbl-teal { font-size: 12.5px; font-weight: 700; fill: #0f7a72; text-anchor: end; }
      .lbl-build { font-size: 12.5px; font-weight: 700; fill: #0f7a72; }
      .leg { font-size: 12.5px; fill: #3c4650; }
      .note { font-size: 12.5px; fill: #616e7c; text-anchor: end; }
      .dark { stroke: #3c4650; stroke-width: 1.6; fill: none; marker-end: url(#a-dark); }
      .blue { stroke: #2a74b0; stroke-width: 1.8; fill: none; marker-end: url(#a-blue); }
      .red { stroke: #c62828; stroke-width: 1.8; fill: none; marker-end: url(#a-red); }
      .retry { stroke: #c4571b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#a-retry); }
      .teal { stroke: #0f7a72; stroke-width: 1.6; fill: none; marker-end: url(#a-teal); }
      .guard { fill: #fdf3d7; stroke: #e2a93b; stroke-width: 1.6; }
      .coord { fill: #e8f0fc; stroke: #3d7be0; stroke-width: 1.6; }
      .spec { fill: #e5f6e8; stroke: #3cb35a; stroke-width: 1.6; }
      .verif { fill: #f1e8fc; stroke: #9050e0; stroke-width: 1.6; }
      .clar { fill: #e4f0fa; stroke: #2a74b0; stroke-width: 1.6; }
      .refuse { fill: #fde6e6; stroke: #d64545; stroke-width: 1.6; }
      .neutral { fill: #f4f6f8; stroke: #7b8794; stroke-width: 1.6; }
      .user { fill: #f4f6f8; stroke: #7b8794; stroke-width: 1.6; }
      .collect { fill: #e6f7f5; stroke: #0f7a72; stroke-width: 1.6; }
      .extract { fill: #eef3f8; stroke: #3d5a80; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="2200" height="740" fill="#ffffff"/>
  <text x="18" y="30" class="title">FinSight architecture</text>

  <!-- corpus build: metadata, then captions, then Transcribe. A question does not run this. -->
  <text x="328" y="46" class="lbl-build">Build corpus, before any question. Writes no label.</text>
  <path d="M478,97 L508,97" class="teal"/>
  <path d="M658,97 L688,97" class="teal"/>
  <path d="M583,136 L583,176" class="teal"/>
  <path d="M772,136 L772,152 L620,152 L620,176" class="teal"/>
  <text x="786" y="146" class="lbl-build">text and source</text>

  <rect x="328" y="58" width="150" height="78" rx="8" class="collect" filter="url(#shadow)"/>
  <text x="403" y="82" class="h">YouTube metadata</text>
  <text x="403" y="100" class="s">id, title, date</text>
  <text x="403" y="116" class="s">listed channels</text>

  <rect x="508" y="58" width="150" height="78" rx="8" class="collect" filter="url(#shadow)"/>
  <text x="583" y="82" class="h">Public captions</text>
  <text x="583" y="100" class="s">YouTube auto-captions</text>
  <text x="583" y="116" class="s">tried first</text>

  <rect x="688" y="58" width="168" height="78" rx="8" class="collect" filter="url(#shadow)"/>
  <text x="772" y="82" class="h">Transcribe</text>
  <text x="772" y="100" class="s">on 429 or no track</text>
  <text x="772" y="116" class="s">captions, else speech</text>

  <g transform="translate(0,120)">

  <!-- ===== arrows ===== -->
  <path d="M125,252 L161,252" class="dark"/>
  <path d="M338,252 L374,252" class="dark"/>
  <text x="356" y="241" class="lbl-m">Pass</text>

  <!-- clarification loop from the prompt screen -->
  <path d="M250,209 L250,141" class="blue"/>
  <text x="262" y="180" class="lbl">Unclear or missing info</text>
  <path d="M178,109 L71,109 L71,220" class="blue"/>
  <text x="95" y="101" class="lbl">Asks user</text>

  <!-- several stored videos: ask which one -->
  <path d="M400,208 L400,128 L325,128" class="blue"/>
  <text x="332" y="116" class="lbl">Which post?</text>
  <text x="332" y="132" class="lbl">A record uses every post</text>

  <!-- refusal at input -->
  <path d="M250,295 L250,376" class="red"/>
  <text x="262" y="339" class="lbl">Advice request</text>
  <path d="M178,405 L71,405 L71,284" class="red"/>
  <text x="86" y="422" class="lbl">Explains why</text>

  <!-- a question reads the store; it does not write one -->
  <path d="M550,132 L550,208" class="teal"/>
  <text x="558" y="176" class="lbl">Read</text>

  <!-- the chosen stored post goes to claim extraction -->
  <path d="M564,252 L730,252" class="dark"/>
  <text x="647" y="242" class="lbl-m">One post</text>
  <text x="647" y="268" class="s">cut-off = post date</text>
  <path d="M890,252 L926,252" class="dark"/>

  <!-- orchestrator -> specialists -> auditor -->
  <path d="M1101,232 C1124,232 1122,140 1142,140" class="dark"/>
  <path d="M1101,272 C1124,272 1122,363 1142,363" class="dark"/>
  <path d="M1349,140 C1372,140 1370,232 1394,232" class="dark"/>
  <path d="M1349,363 C1372,363 1370,272 1394,272" class="dark"/>

  <!-- auditor yes -> overall -> final gate -->
  <path d="M1571,252 L1627,252" class="dark"/>
  <text x="1588" y="241" class="lbl">Yes</text>
  <path d="M1774,252 L1811,252" class="dark"/>

  <!-- final gate outcomes -->
  <path d="M1988,232 C2012,232 2010,179 2034,179" class="dark"/>
  <text x="2028" y="166" class="lbl-r">Pass</text>
  <path d="M1988,272 C2012,272 2010,325 2034,325" class="red"/>
  <text x="2028" y="349" class="lbl-r">Flag</text>

  <!-- retry: auditor "No" -> orchestrator re-plans -->
  <path d="M1484,208 L1484,48 L1014,48 L1014,206" class="retry"/>
  <text x="1249" y="64" class="lbl-m">No: Orchestrator re-plans / retrieves more (max 1 retry per sub-claim)</text>

  <!-- still failing -> overall -->
  <path d="M1484,296 L1484,520 L1702,520 L1702,293" class="retry"/>
  <text x="1593" y="542" class="lbl-m">Still failing: sub-claim = Insufficient Evidence</text>

  <!-- ===== boxes ===== -->
  <rect x="18" y="222" width="107" height="60" rx="30" class="user" filter="url(#shadow)"/>
  <text x="71" y="248" class="h">User</text>
  <text x="71" y="266" class="s">prompt</text>

  <rect x="178" y="79" width="145" height="60" rx="8" class="clar" filter="url(#shadow)"/>
  <text x="250.5" y="104" class="h">Clarification</text>
  <text x="250.5" y="123" class="s">influencer or company</text>

  <rect x="163" y="209" width="175" height="86" rx="8" class="guard" filter="url(#shadow)"/>
  <text x="250.5" y="238" class="h">Advice Boundary Agent</text>
  <text x="250.5" y="259" class="s">initial screening</text>
  <text x="250.5" y="276" class="s">(advice + scope)</text>

  <rect x="178" y="378" width="145" height="54" rx="8" class="refuse" filter="url(#shadow)"/>
  <text x="250.5" y="400" class="h">Refuse</text>
  <text x="250.5" y="419" class="s">with reason, logged</text>

  <rect x="458" y="56" width="184" height="76" rx="8" class="collect" filter="url(#shadow)"/>
  <text x="550" y="80" class="h">Influencer posts</text>
  <text x="550" y="98" class="s">text, URL, date, source</text>
  <text x="550" y="114" class="s">YouTube and two X accounts</text>

  <rect x="376" y="208" width="188" height="88" rx="8" class="collect" filter="url(#shadow)"/>
  <text x="470" y="235" class="h">Collect posts</text>
  <text x="470" y="255" class="s">triggered on pass</text>
  <text x="470" y="271" class="s">reads the store only</text>
  <text x="470" y="287" class="s">does not fetch</text>

  <rect x="730" y="208" width="160" height="88" rx="8" class="extract" filter="url(#shadow)"/>
  <text x="810" y="235" class="h">Claim extraction</text>
  <text x="810" y="255" class="s">keep the quote</text>
  <text x="810" y="271" class="s">one type each</text>
  <text x="810" y="287" class="s">writes no label</text>

  <rect x="926" y="208" width="175" height="88" rx="8" class="coord" filter="url(#shadow)"/>
  <text x="1013.5" y="235" class="h">Orchestrator Agent</text>
  <text x="1013.5" y="255" class="s">route each claim</text>
  <text x="1013.5" y="271" class="s">summary stays separate</text>
  <text x="1013.5" y="287" class="s">plan evidence needs</text>

  <rect x="1144" y="97" width="205" height="87" rx="8" class="spec" filter="url(#shadow)"/>
  <text x="1246.5" y="126" class="h">Financial Analysis Agent</text>
  <text x="1246.5" y="147" class="s">SEC / XBRL data</text>
  <text x="1246.5" y="164" class="s">metrics computed in Python</text>

  <rect x="1144" y="320" width="205" height="87" rx="8" class="spec" filter="url(#shadow)"/>
  <text x="1246.5" y="349" class="h">Narrative Evidence Agent</text>
  <text x="1246.5" y="370" class="s">agentic RAG over filings</text>
  <text x="1246.5" y="387" class="s">support + counter-evidence</text>

  <rect x="1396" y="208" width="175" height="88" rx="8" class="verif" filter="url(#shadow)"/>
  <text x="1483.5" y="235" class="h">Auditor Agent</text>
  <text x="1483.5" y="255" class="s">per sub-claim: number +</text>
  <text x="1483.5" y="271" class="s">citation checks</text>
  <text x="1483.5" y="287" class="s">source tier · enough?</text>

  <rect x="1629" y="213" width="145" height="78" rx="8" class="neutral" filter="url(#shadow)"/>
  <text x="1701.5" y="240" class="h">Overall</text>
  <text x="1701.5" y="258" class="h">assessment</text>
  <text x="1701.5" y="277" class="s">sub-claim verdicts</text>

  <rect x="1813" y="209" width="175" height="86" rx="8" class="guard" filter="url(#shadow)"/>
  <text x="1900.5" y="238" class="h">Advice Boundary Agent</text>
  <text x="1900.5" y="259" class="s">final check</text>
  <text x="1900.5" y="276" class="s">before release</text>

  <rect x="2036" y="150" width="140" height="58" rx="29" class="user" filter="url(#shadow)"/>
  <text x="2106" y="175" class="h">User report</text>
  <text x="2106" y="193" class="s">post and check dates</text>

  <rect x="2036" y="296" width="140" height="58" rx="8" class="refuse" filter="url(#shadow)"/>
  <text x="2106" y="320" class="h">Refuse</text>
  <text x="2106" y="339" class="s">with reason, logged</text>

  <!-- ===== legend ===== -->
  <g transform="translate(18,575)">
    <rect x="0" y="0" width="14" height="14" rx="3" class="guard"/>
    <text x="21" y="12" class="leg">Guardrail</text>
    <rect x="105" y="0" width="14" height="14" rx="3" class="coord"/>
    <text x="126" y="12" class="leg">Coordination</text>
    <rect x="232" y="0" width="14" height="14" rx="3" class="spec"/>
    <text x="253" y="12" class="leg">Specialist agent</text>
    <rect x="380" y="0" width="14" height="14" rx="3" class="verif"/>
    <text x="401" y="12" class="leg">Verification</text>
    <rect x="492" y="0" width="14" height="14" rx="3" class="clar"/>
    <text x="513" y="12" class="leg">Clarification</text>
    <rect x="620" y="0" width="14" height="14" rx="3" class="collect"/>
    <text x="641" y="12" class="leg">Claim source</text>
    <rect x="750" y="0" width="14" height="14" rx="3" class="extract"/>
    <text x="771" y="12" class="leg">Claim extraction</text>
    <path d="M900,7 L940,7" stroke="#c4571b" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="948" y="12" class="leg">Retry / fallback path</text>
  </g>
  <text x="2182" y="587" class="note">Every step is written to the decision log</text>
  </g>
</svg>
