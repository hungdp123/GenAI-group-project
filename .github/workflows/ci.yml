# FinSight CI: runs on every push and on every PR into main.
# Everything runs in MOCK mode: no API keys are used and no OpenAI credit is ever spent.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FINSIGHT_LLM_PROVIDER: mock      # never call a paid LLM in CI
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check finsight tests

  secrets-guard:
    name: No secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Local config / secrets files must not be tracked
        run: |
          if git ls-files | grep -E '(^|/)(config|secrets)\.yaml$|(^|/)\.env$'; then
            echo "::error::A local secrets file is committed. Remove it: git rm --cached <file>"
            exit 1
          fi
      - name: No API keys in tracked files
        run: |
          if git grep -nIE 'sk-(proj-|ant-)?[A-Za-z0-9_-]{20,}' -- . ':!config.example.yaml'; then
            echo "::error::Something that looks like an API key is committed. Remove it and rotate the key."
            exit 1
          fi

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }   # minimum supported version
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }  # the team develops on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Evaluation datasets are valid (and heldout unchanged if frozen)
        run: finsight eval --validate
      - name: Demo claim runs end to end
        run: finsight run "Company X's revenue growth is driven by AI infrastructure demand." --cutoff 2025-07-31 --no-evidence
      - name: Orchestrator graph doc is up to date
        if: runner.os == 'Linux'
        run: |
          finsight graph
          git diff --exit-code docs/orchestrator_graph.md || {
            echo "::error::docs/orchestrator_graph.md is stale. Run 'finsight graph' and commit the result."
            exit 1
          }
