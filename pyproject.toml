[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: multi-agent stress test for company-level investment claims"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pypdf>=5.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.6"]
retrieval = ["sentence-transformers>=3.0"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.setuptools.packages.find]
include = ["finsight*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]  # S, P, C, I verdict shorthands in tests
