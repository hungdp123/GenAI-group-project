[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: multi-agent stress test for company-level investment theses"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "langgraph>=0.2", "pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.setuptools.packages.find]
include = ["finsight*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
