# Copy to config.yaml (gitignored) and fill in. Never commit real keys.
# llm_provider: mock = free canned responses (default); openai = paid API calls.
# Switch with `finsight mode mock` / `finsight mode paid [--model gpt-5.4]`.
llm_provider: mock
# llm_model: gpt-5.4-nano       # paid testing default; use gpt-5.4 for final reported runs
openai_api_key: "YOUR_OPENAI_API_KEY"
# OPENAI_API_KEY takes precedence over this file if both are set.
# anthropic_api_key: "sk-ant-..."

# Narrative orchestrator: LLM evidence preparation, without stance or verdict.
# Commands below are PowerShell ENVIRONMENT settings, not YAML fields.
# Requires company indexes and a real model/key (private config.yaml) or Ollama.
# Copy commands without the leading '# '. Output schema: docs/narrative/workflow/workflow_c_rag.md (RAG output).
#
# $env:FINSIGHT_CORPUS_PROFILE = "canonical"
# $env:FINSIGHT_IMPL_NARRATIVE = "finsight.agents.narrative.stub:NarrativeAgent"
# $env:FINSIGHT_IMPL_RETRIEVER = "finsight.agents.narrative.retriever_stub:NarrativeRetriever"
# $env:FINSIGHT_NARRATIVE_BACKEND = "bm25"
# End-to-end registry defaults: C1 full_v1 chunk indexes + BM25.
# FINSIGHT_NARRATIVE_CORPUS_ROOT and FINSIGHT_NARRATIVE_BACKEND override them.
# Standalone RAG retains its separate defaults; see Workflow C.
# $env:FINSIGHT_NARRATIVE_ANALYSIS = "evidence"
# $env:FINSIGHT_NARRATIVE_ANALYSIS_MAX_TOKENS = "1500"
# $env:FINSIGHT_NARRATIVE_STANCE_METHOD = "none"
# $env:FINSIGHT_NARRATIVE_TOP_K = "3"
# $env:FINSIGHT_LLM_PROVIDER = "openai"
# $env:FINSIGHT_LLM_MODEL = "gpt-5.4"
#
# python -m finsight.agents.narrative.rag.basic_rag --ticker META --claim "META's performance is driven by strong demand" --cutoff 2025-07-31 --backend bm25 --top-k 3 --max-tokens 1500
#
# The LLM selects relevant IDs, extracts exact-source facts and writes a cited
# evidence summary. It does not assign stance or decide a claim verdict.
# BM25/dense/hybrid search remains separate from the LLM processing step.
# Orchestrator local alternative: FINSIGHT_NARRATIVE_OLLAMA_MODEL=qwen3-vl:4b-instruct
# and optional FINSIGHT_NARRATIVE_OLLAMA_CONTEXT=20000. Other agents' shared LLM
# provider settings are independent of this Narrative-local model override.
# Explicit opt-out: FINSIGHT_NARRATIVE_ANALYSIS=retrieval for the registry,
# or --retrieval-only for the basic_rag / collect_evidence commands.
# Internal EvidenceItem.stance remains an unassessed NEUTRAL contract placeholder;
# the auditor/policy handoff still needs updating before verdicts are meaningful.

# Optional R4 runtime retrieval (hybrid + cross-encoder, no source-tier priority):
# $env:FINSIGHT_NARRATIVE_BACKEND = "r4"
# $env:FINSIGHT_NARRATIVE_CANDIDATE_K = "50"
# $env:FINSIGHT_NARRATIVE_TOP_K = "3"
# $env:FINSIGHT_NARRATIVE_RERANKER_MODEL = "cross-encoder/ms-marco-MiniLM-L-6-v2"
# $env:FINSIGHT_NARRATIVE_RERANK_OVERFLOW = "truncate"
# Default overflow policy is error. Explicit truncate permits and records model
# input truncation; source passages stay complete. Requires the retrieval extra
# and matching company Qdrant vectors. See docs/narrative/workflow/workflow_c_rag.md, Step 1.

# Optional separate chunk-index selection for the Narrative collector/wrapper:
# FINSIGHT_NARRATIVE_INDEX_TEMPLATE=path/to/C4/{ticker}/2025-07-31/index.json
# FINSIGHT_NARRATIVE_QDRANT_TEMPLATE=path/to/companies/{ticker}/qdrant
# These are environment variables, not YAML keys; see docs/narrative/workflow/workflow_c_rag.md, Step 1.
# Restore/build the matching artifacts first. R4 alone does not select C4.
# Full runtime build alternative (after building, without the benchmark cutoff):
# clear FINSIGHT_NARRATIVE_INDEX_TEMPLATE and FINSIGHT_NARRATIVE_QDRANT_TEMPLATE,
# then set FINSIGHT_NARRATIVE_CORPUS_ROOT=data/narrative/processed/chunking_strategies/C4/full_v1.
# For C1-C4 builds, see docs/narrative/workflow/workflow_b_processing_and_indexes.md.
