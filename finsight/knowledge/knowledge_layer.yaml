# FinSight knowledge layer. Schema owned by Person 5 (Hung); CONTENT owned by Person 4 (Irine).
# Schema = finsight.contracts.schemas.KnowledgeRule. Keep field names stable.
# Full rule book: docs/knowledge_layer.md. Choices and why: docs/decision_rationale.md.
# Corpus: the companies and influencer channels in docs/knowledge_layer.md section 1.
# Influencers: Joseph Carlson, Mark Roussin, Alex Reffett, Meet Kevin.
# Posts are from 2026-04-01 through 2026-09-30. This file does not list them.
# This file is only the routing extract. Routing is deterministic: the orchestrator sends each claim to
# exactly the `collectors` listed for its type. No LLM chooses or overrides the route.
# Extraction is deterministic first. The sentence rules are in docs/knowledge_layer.md section 4.
# A model labels only a bare figure whose sentence names neither a company nor a measure. It does not split.
#
#   collectors:            subset of [financial, narrative], called on the first attempt
#   retry_collectors:      extra collectors added when the orchestrator re-plans a sub-claim for its retry
#                          (the audit failed, or no evidence came from a required tier)
#   highest_verdict:       verdict cap (null only when refuse: true)
#   tier_requirement:      tiers whose SUPPORTING evidence can justify a positive verdict
#   counter_evidence_only: challenging evidence from tier_requirement blocks SUPPORTED
#   refuse:                do not analyze; refuse the whole request
# Sub-claim types not listed here (and OTHER) fall back to `fallback` below.
#
# Decided 5 Oct 2026. See docs/decision_rationale.md.
#   D16  BUSINESS_RISK: Tier 1 can Support. A Tier 2 remark can at most Partially Support.
#        Claims not in the table (OTHER): a Tier 2 company release can Support (team decision, 31 Oct 2026).
#   D22  retry_collectors are empty. A retry does not call the other specialist.
# Updated 28 Oct 2026: LEVERAGE has no collector (the financial agent cannot calculate debt-to-equity).
# Updated 26 Oct 2026: the route comes only from this table (no LLM router). A result against analyst
# estimates and an "earnings report" sentence with no measure are typed OTHER.
version: "0.8"

rules:
  - sub_claim_type: HISTORICAL_GROWTH
    collectors: [financial]
    retry_collectors: []
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1]
    note: "Past change in consolidated revenue, operating income, operating cash flow, or diluted earnings per share. The words pick the series. Supported only when the Tier 1 record matches value, direction, and period. Use the consolidated figure, not a segment. A wrong number is rewritten from that record. An EPS result against analyst estimates (\"lower than expected\", \"beat estimates\") is not this type. Do not add the narrative agent."

  - sub_claim_type: NET_INCOME_GROWTH
    collectors: [financial]
    retry_collectors: []
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1]
    note: "Past change in reported accounting profit. Supported only when the Tier 1 record matches value, direction, and period. A figure that removes gains is not this type. \"Earnings report\" or \"earnings call\" names the event, not profit. Do not add the narrative agent."

  - sub_claim_type: PROFITABILITY
    collectors: [financial]
    retry_collectors: []
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1]
    note: "Operating margin, net margin, and gross margin. Gross margin is gross profit divided by revenue. A segment margin is not this type. Supported only from a Tier 1 filing. Do not add the narrative agent."

  - sub_claim_type: CASH_GENERATION
    collectors: [financial]
    retry_collectors: []
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1]
    note: "Free cash flow, operating cash flow, and free cash flow margin. Free cash flow margin is free cash flow divided by revenue. Supported only from a Tier 1 filing. Do not add the narrative agent."

  - sub_claim_type: LIQUIDITY
    collectors: [financial]
    retry_collectors: []
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1]
    note: "Current ratio and cash ratio, level and direction. Cash ratio is cash divided by short-term bills. Supported only from a Tier 1 filing. Do not add the narrative agent."

  - sub_claim_type: LEVERAGE
    collectors: []
    retry_collectors: []
    highest_verdict: INSUFFICIENT_EVIDENCE
    tier_requirement: [TIER_1]
    note: "Debt-to-equity is not calculated (debt is not mapped in the SEC data), so no agent is called and the label is Insufficient Evidence. The narrative agent cannot calculate the ratio either. A debt amount is not this type; it is OTHER and goes to the narrative agent. Decided 28 Oct 2026."

  - sub_claim_type: PROFITABILITY_CASH_LEVERAGE
    collectors: [financial]
    retry_collectors: []
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1]
    note: "Older stored rows that still use the merged type. New rows use PROFITABILITY, CASH_GENERATION, LIQUIDITY, or LEVERAGE."

  - sub_claim_type: DEMAND_ATTRIBUTION
    collectors: [narrative]
    retry_collectors: []
    highest_verdict: PARTIALLY_SUPPORTED
    tier_requirement: [TIER_1, TIER_2]
    note: "Cap stays PARTIALLY_SUPPORTED. Tier 1 or Tier 2 may support that partial verdict. A Supported verdict when the filing quantifies one driver's share cannot be expressed as a single cap. Do not add the financial agent on retry. Retrieve the narrative passage again only when it is missing."

  - sub_claim_type: CONTINUATION
    collectors: [narrative]
    retry_collectors: []
    highest_verdict: PARTIALLY_SUPPORTED
    tier_requirement: [TIER_2]
    note: "A user's forward-looking claim, such as growth just getting started. Tier 2 only. Never above PARTIALLY_SUPPORTED. Past numbers are not a retry collector. \"Lower than expected\" compares a past result with analyst estimates; it is not forward-looking."

  - sub_claim_type: COMPARATIVE
    collectors: []
    highest_verdict: INSUFFICIENT_EVIDENCE
    tier_requirement: []
    note: "A ranking with no measure, such as biggest winner, stays Insufficient Evidence. No agent is called. When the sentence names a calculated measure and two companies in the table, each company is checked on that measure and the two figures are compared. That path is not this row."

  - sub_claim_type: BUSINESS_RISK
    collectors: [narrative]
    retry_collectors: []
    # DECISION D16: SUPPORTED needs a Tier 1 risk factor. A Tier 2 remark can at most Partially Support.
    # Tier 1 or Tier 2 challenging evidence blocks SUPPORTED.
    highest_verdict: SUPPORTED
    tier_requirement: [TIER_1, TIER_2]
    counter_evidence_only: true
    note: "Supported only when a 10-K or 10-Q risk factor states the risk. A Tier 2 remark is at most Partially Supported. Tier 1 or Tier 2 counter-evidence blocks SUPPORTED. Do not add the financial agent on retry."

  - sub_claim_type: PERSONALIZED_ADVICE
    collectors: []
    highest_verdict: null
    tier_requirement: []
    refuse: true
    note: "Refused before decomposition. This row is the backup if a sub-claim of this type is still emitted."

fallback:
  sub_claim_type: OTHER
  collectors: [narrative]
  retry_collectors: []
  highest_verdict: SUPPORTED
  tier_requirement: [TIER_1, TIER_2]
  counter_evidence_only: true
  note: "Not labeled out of scope up front. Search the stored documents. Supported when a Tier 1 passage or the company's own release (Tier 2) states the claim. Nothing in Tier 1 or Tier 2 means INSUFFICIENT_EVIDENCE. Do not invent a formula. Gross-profit growth, a run rate, net income excluding gains, a segment margin, a cost or charge, user counts, and a result against analyst estimates stay here."
